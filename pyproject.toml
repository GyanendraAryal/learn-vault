[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learn-vault"
dynamic = ["version"]
description = 'A personalized AI learning assistant that uses RAG to turn YouTube playlists, videos, audio, and documents into a searchable knowledge base for learning, question answering, and study notes.'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Gyanendra Aryal", email = "gyanendraaryal4@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/Gyanendra Aryal/learn-vault#readme"
Issues = "https://github.com/Gyanendra Aryal/learn-vault/issues"
Source = "https://github.com/Gyanendra Aryal/learn-vault"

[tool.hatch.version]
path = "src/learn_vault/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/learn_vault tests}"

[tool.coverage.run]
source_pkgs = ["learn_vault", "tests"]
branch = true
parallel = true
omit = [
  "src/learn_vault/__about__.py",
]

[tool.coverage.paths]
learn_vault = ["src/learn_vault", "*/learn-vault/src/learn_vault"]
tests = ["tests", "*/learn-vault/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
